apiVersion: apps/v1
kind: Deployment
metadata:
    name: webserver-test
spec:
    selector:
        matchLabels:
            app: webserver-test
    template:
        metadata:
            labels:
                app: webserver-test
        spec:
            containers:
                - name: webserver-test
                  image: francescorisso/dashboard_casa_nginx:test
                  imagePullPolicy: Always
                  resources:
                      limits:
                          memory: "128Mi"
                          cpu: "500m"
                  ports:
                      - containerPort: 80
                      - containerPort: 443
                  env:
                      - name: SSL_key
                        value: "..."
                      - name: SSL_pem
                        value: "..."

---
apiVersion: v1
kind: Service
metadata:
    name: webserver-test
spec:
    type: NodePort
    selector:
        app: webserver-test
    ports:
        - protocol: TCP
          port: 8001
          targetPort: 80
          nodePort: 31081
          name: http
        - protocol: TCP
          port: 8002
          targetPort: 443
          nodePort: 31444
          name: https
