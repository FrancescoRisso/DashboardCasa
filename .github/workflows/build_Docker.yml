name: build docker containers and push to Dockerhub

on:
    push:
        branches: ["build", "dev-build"]
    workflow_run:
        workflows: ["React build and commit to build branch"]
        types:
            - completed

jobs:
    nginxDocker:
        runs-on: ubuntu-latest
        steps:
            - name: Choose correct docker hub tag
              run: |
                  if [[ $GITHUB_REF_NAME == 'build' ]]; then
                      echo "DOCKER_HUB_TAG=latest" >> "$GITHUB_ENV"
                  else
                      echo "DOCKER_HUB_TAG=test" >> "$GITHUB_ENV"
                  fi

            - name: Clone repository
              uses: actions/checkout@v2
              with:
                  ref: build

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: ./nginx.Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dashboard_casa_nginx:${{ env.DOCKER_HUB_TAG }}

    gunicornDocker:
        runs-on: ubuntu-latest
        steps:
            - name: Choose correct docker hub tag
              run: |
                  if [[ $GITHUB_REF_NAME == 'build' ]]; then
                      echo "DOCKER_HUB_TAG=latest" >> "$GITHUB_ENV"
                  else
                      echo "DOCKER_HUB_TAG=test" >> "$GITHUB_ENV"
                  fi

            - name: Clone repository
              uses: actions/checkout@v2
              with:
                  ref: build

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: ./gunicorn.Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dashboard_casa_gunicorn:${{ env.DOCKER_HUB_TAG }}

    cleanDevBuildBranch:
        runs-on: ubuntu-latest
        needs: ["gunicornDocker", "nginxDocker"]
        steps:
            - name: Delete branch if on dev
              run: |
                  if [[ $GITHUB_REF_NAME == 'dev-build' ]]; then
                      gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$BRANCH
                  fi
