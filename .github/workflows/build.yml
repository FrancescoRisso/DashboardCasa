name: Build new release

on:
    push:
        branches: ["code", "dev"]

jobs:
    buildReact:
        name: Build the react app and commit it to the build branch
        runs-on: ubuntu-latest
        steps:
            - name: Choose correct target branch
              run: |
                  if [[ $GITHUB_REF_NAME == 'code' ]]; then
                      echo "TARGET_BRANCH=build" >> "$GITHUB_ENV"
                  else
                      echo "TARGET_BRANCH=dev-build" >> "$GITHUB_ENV"
                  fi

            - name: Clone repository
              uses: actions/checkout@v2

            # - name: Use Node.js 24.x
            #   uses: actions/setup-node@v1
            #   with:
            #       node-version: 24.x

            # - name: Install dependencies
            #   run: npm install -f

            # - name: Generate react build
            #   run: npm run build
            #   env:
            #       CI: false

            - name: DEBUG
              run: mkdir build

            - name: Create .github folder inside the build folder
              run: mkdir build/.github/

            - name: Copy github actions to the build branch
              run: cp -r .github/workflows build/.github/workflows

            - name: Copy all the build utilities to the build folder
              run: cp -a build_utilities/. build

            - name: Copy server to the build folder
              run: mv server build/server/

            # - name: Update error logging in the build server
            #   uses: jacobtomlinson/gha-find-replace@v2
            #   with:
            #       find: 'print(f"{datetime.now().strftime(''%d/%m/%Y %H:%M:%S'')} [ERR ] '
            #       replace: 'app.logger.error(f"'
            #       include: "build/server/functions/log.py"
            #       "regex": false

            # - name: Update info logging in the build server
            #   uses: jacobtomlinson/gha-find-replace@v2
            #   with:
            #       find: 'print(f"{datetime.now().strftime(''%d/%m/%Y %H:%M:%S'')} [INFO] '
            #       replace: 'app.logger.info(f"'
            #       include: "build/server/functions/log.py"
            #       "regex": false

            # - name: Update port number in the cron generation
            #   uses: jacobtomlinson/gha-find-replace@v2
            #   with:
            #       find: ":3001"
            #       replace: ":8000"
            #       include: "build/server/functions/schedules.py"
            #       "regex": false

            - name: Push to the build branch
              uses: s0/git-publish-subdir-action@develop
              env:
                  REPO: self
                  BRANCH: "$TARGET_BRANCH"
                  FOLDER: build
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
                  MESSAGE: "${{ github.event.head_commit.message }}"

    nginxDocker:
        runs-on: ubuntu-latest
        needs: ["buildReact"]
        steps:
            - name: Choose correct git branch and docker tag
              run: |
                  if [[ $GITHUB_REF_NAME == 'code' ]]; then
                      echo "DOCKER_HUB_TAG=latest" >> "$GITHUB_ENV"
                      echo "BUILD_BRANCH=build" >> "$GITHUB_ENV"
                  else
                      echo "DOCKER_HUB_TAG=test" >> "$GITHUB_ENV"
                      echo "BUILD_BRANCH=dev-build" >> "$GITHUB_ENV"
                  fi

            - name: Clone repository
              uses: actions/checkout@v2
              with:
                  ref: ${{ env.BUILD_BRANCH }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: ./nginx.Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dashboard_casa_nginx:${{ env.DOCKER_HUB_TAG }}

    gunicornDocker:
        runs-on: ubuntu-latest
        needs: ["buildReact"]
        steps:
            - name: Choose correct git branch and docker tag
              run: |
                  if [[ $GITHUB_REF_NAME == 'code' ]]; then
                      echo "DOCKER_HUB_TAG=latest" >> "$GITHUB_ENV"
                      echo "BUILD_BRANCH=build" >> "$GITHUB_ENV"
                  else
                      echo "DOCKER_HUB_TAG=test" >> "$GITHUB_ENV"
                      echo "BUILD_BRANCH=dev-build" >> "$GITHUB_ENV"
                  fi

            - name: Debug
              run: cat .github/workflows/build_Docker.yml

            - name: Clone repository
              uses: actions/checkout@v2
              with:
                  ref: ${{ env.BUILD_BRANCH }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_PASSWORD }}

            - name: Build and push
              uses: docker/build-push-action@v3
              with:
                  context: .
                  file: ./gunicorn.Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/dashboard_casa_gunicorn:${{ env.DOCKER_HUB_TAG }}

    cleanDevBuildBranch:
        runs-on: ubuntu-latest
        needs: ["gunicornDocker", "nginxDocker"]
        steps:
            - name: Delete branch if on dev
              run: |
                  if [[ $GITHUB_REF_NAME == 'dev' ]]; then
                      gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$BRANCH
                  fi
